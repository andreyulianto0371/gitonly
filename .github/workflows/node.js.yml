 
name: Build & Deploy Hugo site with Blowfish theme

on:
  push:
    branches:
      - Main  # atau ganti dengan branch yang kamu gunakan

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Cocok untuk Blowfish

      - name: Install NPM dependencies (for Blowfish)
        run: |
          cd themes/blowfish
          npm install
          cd ../..

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true  # Penting! Blowfish butuh Hugo Extended

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
